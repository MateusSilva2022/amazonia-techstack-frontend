<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazônia TechStack - Assistente de escrita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo-app">
  <span class="logo">Amazônia TechStack</span>
  <a href="catalogo.html" class="link-sair">Voltar</a>
</header>

<main class="pagina-assistente">
  <div class="painel-assistente">
    <h2>Assistente de escrita</h2>
    <p class="subtitulo">Correção ortográfica automática pra descrição do seu produto</p>

    <label for="texto-produtor">Digite seu texto</label>
    <textarea id="texto-produtor" placeholder="Escreva a descrição do seu produto..."></textarea>

    <a href="#" class="botao-primario botao-pequeno">Corrigir texto</a>

    <label>Resultado</label>
    <div class="caixa-resultado">
      Pimenta cheirosa colhida à mão, direto da Fazenda Boa Esperança. Fresca, aromática e pronta pra sua cozinha.
    </div>
  </div>

  <div class="painel-imagem">
    <label>Adicionar imagem</label>
    <div class="area-upload">
      <span>+ Escolher foto</span>
    </div>
  </div>
</main>
</body>
</html>
