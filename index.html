<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazônia TechStack - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tela-login">
  <div class="painel-marca">
    <span class="logo">Amazônia TechStack</span>
    <div class="chamada">
      <h1>Direto da fazenda para a sua mesa.</h1>
      <p>Marketplace que conecta produtores rurais direto aos compradores, com fazenda de origem rastreável e entrega simples.</p>
    </div>
  </div>
  <div class="painel-form">
    <div class="form-login">
      <h2>Entrar na sua conta</h2>
      <div class="campo">
        <label for="email">E-mail ou telefone</label>
        <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="********">
        <a href="#" class="esqueci">Esqueceu sua senha?</a>
      </div>
      <a href="catalogo.html" class="botao-primario">Entrar</a>
      <p class="rodape-form">Ainda não tem conta? <a href="cadastro-produtor.html">Criar conta gratuita →</a></p>
    </div>
  </div>
</div>
</body>
</html>
