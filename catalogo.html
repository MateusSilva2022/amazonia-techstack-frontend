<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazônia TechStack - Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topo-app">
      <span class="logo">Amazônia TechStack</span>
      <input type="text" id="input-busca" class="busca" placeholder="Buscar produtos, fazendas ou digite 'ranking'...">
      <a href="cadastro-produto.html" class="link-sair">Cadastrar produto</a>
      <a href="index.html" class="link-sair">Sair</a>
    </header>

    <main class="pagina-catalogo">
      <div id="feedback-ia" class="feedback-ia oculto"></div>

      <section id="secao-ranking" class="secao-ranking oculto">
        <h2> Fazendas em Destaque (Ranqueadas por IA)</h2>
        <div id="lista-ranking" class="grade-ranking"></div>
      </section>

      <h1>Catálogo de produtos</h1>

      <div class="grade-produtos" id="grade-produtos">
        <div class="cartao-produto" data-tags="pimenta cheirosa tempero ardido fazenda boa esperanca">
          <a href="produto.html" class="link-produto">
            <img src="imagens/pimenta-cheirosa.webp" alt="Pimenta cheirosa" class="foto-produto">
            <h3>Pimenta cheirosa</h3>
          </a>
          <a href="vitrine-publica.html" class="fazenda-origem">Fazenda Boa Esperança</a>
          <p class="preco">R$ 4,90 / kg</p>
        </div>

        <div class="cartao-produto" data-tags="pimentao legume grao fazenda boa esperanca">
          <a href="produto.html" class="link-produto">
            <img src="imagens/pimentao.jpg" alt="Pimentão" class="foto-produto">
            <h3>Pimentão</h3>
          </a>
          <a href="vitrine-publica.html" class="fazenda-origem">Fazenda Boa Esperança</a>
          <p class="preco">R$ 2,60 / kg</p>
        </div>

        <div class="cartao-produto" data-tags="cheiro-verde hortalica tempero verde fazenda boa esperanca">
          <a href="produto.html" class="link-produto">
            <img src="imagens/cheiro-verde.jpg" alt="Cheiro-verde" class="foto-produto">
            <h3>Cheiro-verde</h3>
          </a>
          <a href="vitrine-publica.html" class="fazenda-origem">Fazenda Boa Esperança</a>
          <p class="preco">R$ 7,20 / kg</p>
        </div>
      </div>
    </main>

    <script src="script.js"></script>

  </body>
</html>
